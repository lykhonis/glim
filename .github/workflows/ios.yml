name: iOS

on:
  workflow_call:

jobs:
  build:
    uses: ./.github/workflows/native.yml
    with:
      name: ios
      runs-on: macos-15
      nx: |
        pnpm exec nx run examples:build-ios-sim

  e2e:
    needs: [build]
    uses: ./.github/workflows/native.yml
    with:
      name: ios-e2e
      runs-on: macos-15
      nx: |
        pnpm exec nx run-many -t run-ios --projects=tag:example --parallel=1 --smoke=15
