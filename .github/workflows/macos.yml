name: macOS

on:
  workflow_call:

jobs:
  ci:
    uses: ./.github/workflows/native.yml
    with:
      runs-on: macos-15
      nx: |
        # Full build + every registered ctest (units, CPU goldens, GPU goldens).
        pnpm -s test:host
        pnpm exec nx run examples:build
        pnpm exec nx run examples:build-software
        # Size budget: release static Metal slice.
        cmake --preset macos-metal-release
        cmake --build build/macos-metal-release --target glim-core glim-paint glim-paint-gpu glim-gpu-metal glim-shell
        node tools/size-budgets.mjs metal-static
