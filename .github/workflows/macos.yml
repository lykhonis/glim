name: macOS

on:
  workflow_call:

jobs:
  build:
    uses: ./.github/workflows/native.yml
    with:
      name: macos
      runs-on: macos-15
      timeout-minutes: 45
      emsdk: 6.0.9
      chrome: true
      nx: |
        pnpm -s test:host
        pnpm -s package-test
        pnpm exec nx run examples:build
        pnpm exec nx run examples:build-software
        cmake --preset macos-metal-release
        cmake --build build/macos-metal-release --target glim-core glim-image glim-paint glim-paint-gpu glim-toolkit glim-toolkit-host glim-shell glim-gpu-metal glim-smarthome glim-infotainment glim-glass glim-video glim-webview
        node tools/size-budgets.mjs metal-toolkit
        pnpm -s startup build/macos-metal-release/examples/smarthome/glim-smarthome --encoded --budget 450
        pnpm -s startup build/macos-metal-release/examples/infotainment/glim-infotainment --encoded --budget 1200
        pnpm -s startup build/macos-metal-release/examples/glass/glim-glass --encoded --budget 300
        pnpm exec nx run-many -t run run-software --projects=tag:example --exclude=web --parallel=1 --smoke=15
        pnpm exec nx run examples:build-web
        WEBGPU_ANGLE=metal pnpm -s web-goldens
        # Typing into a toolkit text field in Chrome (N8.10).
        cmake --build build/web-webgpu-debug --target glim-text
        WEBGPU_ANGLE=metal node tools/web-text-e2e.mjs
        pnpm -s xcframework
        pnpm -s apple-sample
