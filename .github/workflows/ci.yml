name: ci

on:
  push:
  pull_request:

jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Install Ninja
        run: brew install ninja
      - name: Configure
        run: cmake --preset macos-metal-debug
      - name: Build math tests
        run: cmake --build --preset macos-metal-debug --target glim-math-test
      - name: Test
        run: ctest --test-dir build/macos-metal-debug --output-on-failure
      - name: Build hello
        run: cmake --build --preset macos-metal-debug --target glim-hello
        if: hashFiles('packages/glim-gpu-metal/CMakeLists.txt') != ''
