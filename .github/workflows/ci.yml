name: ci

on:
  push:
  pull_request:

jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Install Ninja
        run: brew install ninja
      - name: Configure
        run: cmake --preset macos-metal-debug
      - name: Build tests and hello
        run: cmake --build --preset macos-metal-debug --target glim-math-test glim-merge-test glim-golden-test glim-hello
      - name: Test
        run: ctest --test-dir build/macos-metal-debug --output-on-failure
