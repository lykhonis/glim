name: tvOS

on:
  workflow_call:

jobs:
  build:
    uses: ./.github/workflows/native.yml
    with:
      name: tvos
      runs-on: macos-15
      nx: |
        pnpm exec nx run examples:build-tvos-sim

  e2e:
    needs: [build]
    uses: ./.github/workflows/native.yml
    with:
      name: tvos-e2e
      runs-on: macos-15
      nx: |
        pnpm exec nx run-many -t run-tvos --projects=tag:example --parallel=1 --smoke=15
