name: E2E

# Launches every example on each platform after CI passes and fails when
# one dies within the smoke window (debug builds abort on failed asserts).
# Separate from CI: emulators and simulators are slow and need a GUI.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: true

jobs:
  macos:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    uses: ./.github/workflows/native.yml
    with:
      name: e2e-macos
      runs-on: macos-15
      ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      nx: |
        pnpm exec nx run-many -t run run-software --projects=tag:example --exclude=web --parallel=1 --smoke=15

  ios:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    uses: ./.github/workflows/native.yml
    with:
      name: e2e-ios
      runs-on: macos-15
      ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      nx: |
        pnpm exec nx run-many -t run-ios run-tvos --projects=tag:example --parallel=1 --smoke=15

  android:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    uses: ./.github/workflows/native.yml
    with:
      name: e2e-android
      runs-on: ubuntu-24.04
      packages: ninja-build glslang-tools
      ndk: r26d
      ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      nx: |
        # x86_64 emulator under KVM; GitHub's Linux runners cannot accelerate arm64.
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
        sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
        sdk="$ANDROID_HOME/cmdline-tools/latest/bin"
        image="system-images;android-34;google_apis;x86_64"
        yes | "$sdk/sdkmanager" --licenses > /dev/null || true
        "$sdk/sdkmanager" --install emulator platform-tools "$image" > /dev/null
        echo no | "$sdk/avdmanager" create avd -n e2e -k "$image" -d pixel_6
        "$ANDROID_HOME/emulator/emulator" -avd e2e -no-window -no-audio -no-boot-anim \
          -gpu swiftshader_indirect -no-snapshot &
        "$ANDROID_HOME/platform-tools/adb" wait-for-device
        pnpm exec nx run-many -t run-android --projects=tag:example --parallel=1 --smoke=20 -c x86_64
