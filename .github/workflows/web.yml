name: Web

on:
  workflow_call:

jobs:
  ci:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build
      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: CI
        run: |
          pnpm exec nx run examples:build-web
      - name: Check staged bundle
        run: |
          test -f build/web-webgpu-debug/examples/web/serve/index.html
          test -f build/web-webgpu-debug/examples/web/serve/glass.html
          test -f build/web-webgpu-debug/examples/web/serve/gradients.html
          test -f build/web-webgpu-debug/examples/web/serve/foreign.html
          test -f build/web-webgpu-debug/examples/web/serve/main.js
          test -f build/web-webgpu-debug/examples/web/serve/lib/glim.js
          test -f build/web-webgpu-debug/examples/web/serve/glim-app.js
          test -f build/web-webgpu-debug/examples/web/serve/glim-app.wasm
      - name: Size budget (release hello wasm, gzip)
        run: |
          cmake --preset web-webgpu-release
          cmake --build build/web-webgpu-release --target glim-hello
          node tools/size-budgets.mjs wasm-gzip

  # Experimental: bundle serves over http. Screenshots need real Chrome.
  capture:
    runs-on: ubuntu-24.04
    needs: [ci]
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build
      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build web bundle
        run: |
          pnpm exec nx run examples:build-web
      - name: Setup Chrome
        uses: browser-actions/setup-chrome@v1
      - name: WebGPU screenshots vs CPU goldens
        run: |
          cmake -S tools/glim-golden -B build/glim-golden -DCMAKE_BUILD_TYPE=Release
          cmake --build build/glim-golden
          node tools/web-goldens.mjs
