name: Web

on:
  push:
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build
      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: CI
        run: |
          pnpm exec nx run examples:build-web
      - name: Check staged bundle
        run: |
          test -f build/web-webgpu-debug/examples/web/serve/index.html
          test -f build/web-webgpu-debug/examples/web/serve/glass.html
          test -f build/web-webgpu-debug/examples/web/serve/gradients.html
          test -f build/web-webgpu-debug/examples/web/serve/foreign.html
          test -f build/web-webgpu-debug/examples/web/serve/main.js
          test -f build/web-webgpu-debug/examples/web/serve/lib/glim.js
          test -f build/web-webgpu-debug/examples/web/serve/glim-app.js
          test -f build/web-webgpu-debug/examples/web/serve/glim-app.wasm

  # Experimental: bundle serves over http. Screenshots need real Chrome.
  capture:
    runs-on: ubuntu-24.04
    needs: [ci]
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build
      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build web bundle
        run: |
          pnpm exec nx run examples:build-web
      - name: Serve and smoke-check pages
        run: |
          (cd build/web-webgpu-debug/examples/web/serve && python3 -m http.server 8080 >/tmp/glim-web.log 2>&1 &)
          sleep 2
          for p in index.html glass.html gradients.html foreign.html; do curl --fail --silent --output /dev/null http://localhost:8080/$p; done
          echo "web serve smoke ok"
