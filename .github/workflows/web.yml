name: Web

on:
  push:
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build
      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: CI
        run: |
          pnpm exec nx run examples:build-web
      - name: Check staged bundle
        run: |
          test -f build/web-webgpu-debug/examples/web/serve/index.html
          test -f build/web-webgpu-debug/examples/web/serve/glass.html
          test -f build/web-webgpu-debug/examples/web/serve/gradients.html
          test -f build/web-webgpu-debug/examples/web/serve/foreign.html
          test -f build/web-webgpu-debug/examples/web/serve/main.js
          test -f build/web-webgpu-debug/examples/web/serve/lib/glim.js
          test -f build/web-webgpu-debug/examples/web/serve/glim-app.js
          test -f build/web-webgpu-debug/examples/web/serve/glim-app.wasm

  # Experimental: bundle serves over http. Screenshots need real Chrome.
  capture:
    runs-on: ubuntu-24.04
    needs: [ci]
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build
      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build web bundle
        run: |
          pnpm exec nx run examples:build-web
      - name: Setup Chrome
        uses: browser-actions/setup-chrome@v1
      - name: WebGPU screenshots vs CPU goldens
        run: |
          pip install --quiet pillow
          bash tools/scripts/run-web-goldens.sh
      - name: Upload got PNGs on mismatch
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: web-got
          path: build/web-webgpu-debug/web-got/
