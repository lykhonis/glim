name: Web

on:
  workflow_call:

jobs:
  build:
    uses: ./.github/workflows/native.yml
    with:
      name: web
      runs-on: ubuntu-24.04
      packages: ninja-build
      emsdk: 6.0.9
      nx: |
        pnpm exec nx run examples:build-web
        serve=build/web-webgpu-debug/examples/web/serve
        for f in index.html main.js lib/glim.js glim-app.js glim-app.wasm; do
          test -f "$serve/$f" || { echo "missing $serve/$f"; exit 1; }
        done
        cmake --preset web-webgpu-release
        cmake --build build/web-webgpu-release --target glim-core glim-image glim-paint glim-paint-gpu glim-toolkit glim-toolkit-host glim-shell glim-gpu-webgpu
        node tools/size-budgets.mjs wasm-toolkit

  # WebGPU screenshots vs CPU goldens through Chrome on Metal (SwiftShader
  # cannot present a WebGPU canvas). Gating; a blank page fails.
  goldens:
    uses: ./.github/workflows/native.yml
    with:
      name: web-goldens
      runs-on: macos-15
      emsdk: 6.0.9
      chrome: true
      nx: |
        pnpm exec nx run examples:build-web
        WEBGPU_ANGLE=metal pnpm -s web-goldens
