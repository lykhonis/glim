name: Gate

on:
  workflow_call:

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check formatting
        run: pnpm format:check
      - name: Typecheck tool scripts
        run: pnpm typecheck
      - name: Lint workflows
        run: |
          curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash | bash -s -- 1.7.12
          ./actionlint -color
      - name: Build glim-lint
        run: |
          cmake -S tools/glim-lint -B build/glim-lint -DCMAKE_BUILD_TYPE=Release
          cmake --build build/glim-lint
      - name: Test glim-lint
        run: ctest --test-dir build/glim-lint --output-on-failure
      - name: Check factory form
        run: build/glim-lint/glim-lint --root .
