name: Gate

on:
  workflow_call:

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install clang-format
        run: |
          python3 -m pip install --user --quiet 'clang-format==18.1.8'
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Check formatting
        run: tools/format-check.sh
      - name: Check factory form
        run: python3 tools/scripts/check-factories.py
