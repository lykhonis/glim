name: Gate

on:
  workflow_call:

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install clang-format
        run: |
          python3 -m pip install --user --quiet 'clang-format==18.1.8'
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Check formatting
        run: tools/format-check.sh
      - name: Build glim-lint
        run: |
          cmake -S tools/glim-lint -B build/glim-lint -DCMAKE_BUILD_TYPE=Release
          cmake --build build/glim-lint
      - name: Test glim-lint
        run: ctest --test-dir build/glim-lint --output-on-failure
      - name: Check factory form
        run: build/glim-lint/glim-lint --root .
