name: Gate

on:
  workflow_call:

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check formatting
        run: pnpm format:check
      - name: Build glim-lint
        run: |
          cmake -S tools/glim-lint -B build/glim-lint -DCMAKE_BUILD_TYPE=Release
          cmake --build build/glim-lint
      - name: Test glim-lint
        run: ctest --test-dir build/glim-lint --output-on-failure
      - name: Check factory form
        run: build/glim-lint/glim-lint --root .
