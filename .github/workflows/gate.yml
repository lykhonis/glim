name: Gate

on:
  workflow_call:

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check formatting
        run: pnpm format:check
      - name: Typecheck tool scripts
        run: pnpm typecheck
      - name: Lint workflows
        run: |
          curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash | bash -s -- 1.7.12
          ./actionlint -color
      - name: Build glim-lint
        run: |
          cmake -S tools/glim-lint -B build/glim-lint -DCMAKE_BUILD_TYPE=Release
          cmake --build build/glim-lint
      - name: Test glim-lint
        run: ctest --test-dir build/glim-lint --output-on-failure
      - name: Check factory form
        run: build/glim-lint/glim-lint --root .
