name: native

# The one CI job template: checkout, toolchains, pnpm install, then the
# caller's commands under bash -e with strict goldens. Actions are pinned
# by commit SHA (tag in the trailing comment).

on:
  workflow_call:
    inputs:
      name:
        description: Platform label, unique per caller (artifact name)
        required: true
        type: string
      runs-on:
        required: true
        type: string
      packages:
        required: false
        type: string
        default: ""
      ndk:
        description: Android NDK version; empty skips setup
        required: false
        type: string
        default: ""
      emsdk:
        description: Emscripten SDK version; empty skips setup
        required: false
        type: string
        default: ""
      chrome:
        required: false
        type: boolean
        default: false
      timeout-minutes:
        required: false
        type: number
        default: 60
      nx:
        required: true
        type: string

permissions:
  contents: read

jobs:
  ci:
    name: ${{ inputs.name }}
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: pnpm
      - name: Install packages
        if: runner.os == 'Linux' && inputs.packages != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ inputs.packages }}
      - name: Install Ninja
        if: runner.os == 'macOS'
        run: brew install ninja
      - name: Setup Android NDK
        if: inputs.ndk != ''
        uses: nttld/setup-ndk@ed92fe6cadad69be94a966a7ee3271275e62f779 # v1.6.0
        id: setup-ndk
        with:
          ndk-version: ${{ inputs.ndk }}
          link-to-sdk: false
      - name: Export NDK path
        if: inputs.ndk != ''
        run: echo "ANDROID_NDK_HOME=${{ steps.setup-ndk.outputs.ndk-path }}" >> "$GITHUB_ENV"
      - name: Setup Emscripten
        if: inputs.emsdk != ''
        uses: mymindstorm/setup-emsdk@4528d102f7230f0e7b276855c01ea1159be0e984 # v16
        with:
          version: ${{ inputs.emsdk }}
      - name: Setup Chrome
        if: inputs.chrome
        uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2.2.0
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: CI
        shell: bash
        env:
          GLIM_GOLDEN_STRICT: "1"
          GLIM_GOT_DIR: ${{ github.workspace }}/got
        run: |
          set -euo pipefail
          mkdir -p "${{ github.workspace }}/got"
          ${{ inputs.nx }}
      - name: Upload golden failures
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: got-${{ inputs.name }}
          path: ${{ github.workspace }}/got
          if-no-files-found: ignore
