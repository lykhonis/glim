name: Linux

on:
  workflow_call:

jobs:
  build:
    uses: ./.github/workflows/native.yml
    with:
      name: linux
      runs-on: ubuntu-24.04
      packages: ninja-build pkg-config libwayland-dev wayland-protocols libvulkan-dev mesa-vulkan-drivers zlib1g-dev glslang-tools
      nx: |
        # Full build + every registered ctest (units, CPU goldens, GPU goldens).
        pnpm -s test:host
        pnpm -s package-test
        pnpm exec nx run examples:build
        pnpm exec nx run examples:build-software

  coverage:
    uses: ./.github/workflows/native.yml
    with:
      name: linux-coverage
      runs-on: ubuntu-24.04
      packages: ninja-build pkg-config libwayland-dev wayland-protocols libvulkan-dev mesa-vulkan-drivers zlib1g-dev glslang-tools
      nx: |
        pipx install gcovr
        node tools/coverage.mjs

  guest:
    uses: ./.github/workflows/native.yml
    with:
      name: linux-guest
      runs-on: ubuntu-24.04
      packages: ninja-build pkg-config libwayland-dev wayland-protocols libvulkan-dev zlib1g-dev glslang-tools clang libclang-rt-18-dev
      nx: |
        # K76: the default build carries no guest targets.
        cmake -S . -B build/guest-off -G Ninja -DGLIM_SHELL=none
        if ninja -C build/guest-off -t targets all | grep -qE 'glim-(wire|transport|guest|runtime-wamr|wamr)'; then
          echo "default build contains guest targets" >&2
          exit 1
        fi
        # K81: pinned wasi-sdk builds the smoke guest; only this job needs it.
        curl -fsSLo build/wasi-sdk.tar.gz https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-34/wasi-sdk-34.0-x86_64-linux.tar.gz
        echo "b761e3a0721dbae9c09a0059e5fdb2bf917d1b4a8a7b430fb3b5aafb0984b2c4  build/wasi-sdk.tar.gz" | sha256sum -c -
        mkdir -p build/wasi-sdk && tar xzf build/wasi-sdk.tar.gz -C build/wasi-sdk --strip-components=1
        cmake -S . -B build/guest-wamr -G Ninja -DGLIM_SHELL=none -DGLIM_GUEST=ON -DGLIM_WASI_SDK="$PWD/build/wasi-sdk"
        cmake --build build/guest-wamr --target glim-runtime-wamr-smoke
        ctest --test-dir build/guest-wamr -R glim-runtime-wamr-smoke --output-on-failure --no-tests=error
        cmake -S . -B build/guest -G Ninja -DGLIM_SHELL=none -DGLIM_GUEST=ON -DGLIM_FUZZ=ON \
          -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++
        cmake --build build/guest --target glim-wire-test glim-wire-fuzz glim-transport-test glim-transport-fuzz glim-guest-frame-test glim-guest-frame-fuzz glim-guest-host-test glim-guest-host-handshake-fuzz
        ctest --test-dir build/guest -R 'glim-(wire|transport|guest)' --output-on-failure --no-tests=error
        mkdir -p build/wire-corpus build/transport-corpus build/frame-corpus build/handshake-corpus
        build/guest/packages/glim-wire/glim-wire-fuzz -max_total_time=90 -artifact_prefix=build/ build/wire-corpus
        build/guest/packages/glim-transport/glim-transport-fuzz -max_total_time=90 -artifact_prefix=build/ build/transport-corpus
        build/guest/packages/glim-guest/glim-guest-frame-fuzz -max_total_time=90 -artifact_prefix=build/ build/frame-corpus
        build/guest/packages/glim-guest-host/glim-guest-host-handshake-fuzz -max_total_time=90 -artifact_prefix=build/ build/handshake-corpus
