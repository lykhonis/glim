name: Android

on:
  workflow_call:

jobs:
  ci:
    uses: ./.github/workflows/native.yml
    with:
      name: android
      runs-on: ubuntu-24.04
      packages: ninja-build glslang-tools
      ndk: r26d
      nx: |
        pnpm exec nx run examples:build-android
        # Size budget: release hello .so, stripped.
        cmake --preset android-arm64-vulkan-release
        cmake --build build/android-arm64-vulkan-release --target glim-hello
        node tools/size-budgets.mjs android-so
