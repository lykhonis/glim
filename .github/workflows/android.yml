name: Android

on:
  workflow_call:

jobs:
  build:
    uses: ./.github/workflows/native.yml
    with:
      name: android
      runs-on: ubuntu-24.04
      packages: ninja-build glslang-tools
      ndk: r26d
      nx: |
        pnpm exec nx run examples:build-android
        cmake --preset android-arm64-vulkan-release
        cmake --build build/android-arm64-vulkan-release --target glim-core glim-image glim-paint glim-paint-gpu glim-toolkit glim-toolkit-host glim-shell glim-gpu-vulkan glim-volk glim-android-glue
        node tools/size-budgets.mjs android-toolkit

  e2e:
    needs: [build]
    uses: ./.github/workflows/native.yml
    with:
      name: android-e2e
      runs-on: ubuntu-24.04
      timeout-minutes: 40
      packages: ninja-build glslang-tools
      ndk: r26d
      nx: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
        sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
        sdk="$ANDROID_HOME/cmdline-tools/latest/bin"
        image="system-images;android-34;google_apis;x86_64"
        yes | "$sdk/sdkmanager" --licenses > /dev/null || true
        "$sdk/sdkmanager" --install emulator platform-tools "$image" > /dev/null
        export ANDROID_AVD_HOME="$HOME/.android/avd"
        mkdir -p "$ANDROID_AVD_HOME"
        echo no | "$sdk/avdmanager" create avd -n e2e -k "$image" -d pixel_6
        "$ANDROID_HOME/emulator/emulator" -list-avds | grep -qx e2e
        # 4 GB: a WebView binds GMS providers, and LMK killing GMS takes the app with it.
        "$ANDROID_HOME/emulator/emulator" -avd e2e -no-window -no-audio -no-boot-anim -memory 4096 \
          -gpu swiftshader_indirect -no-snapshot &
        adb="$ANDROID_HOME/platform-tools/adb"
        timeout 600 "$adb" wait-for-device
        timeout 600 bash -c "until [ \"\$('$adb' shell getprop sys.boot_completed | tr -d '\r')\" = 1 ]; do sleep 5; done"
        pnpm exec nx run-many -t run-android --projects=tag:example --parallel=1 --smoke=20 -c x86_64
        # Typing reaches a field through the IME: tap the text example's field
        # (top left), type, and read the value it logs.
        "$adb" logcat -c
        trap '"$adb" shell dumpsys input_method | grep -E "mServedView|mCurrentInputConnection" || true;
          "$adb" logcat -d -s glim AndroidRuntime | tail -40' ERR
        "$adb" shell am start -S -n com.glim.text/com.glim.shell.GlimActivity
        scale=$("$adb" shell wm density | grep -oE '[0-9]+' | tail -1)
        # The emulator renders in software: tap until the field takes focus
        # and the IME serves our view, up to a minute. The tap is relative to
        # Glim's surface, which sits below the status bar before API 35.
        for i in $(seq 12); do
          sleep 5
          "$adb" shell uiautomator dump /sdcard/ui.xml > /dev/null
          read -r left top < <("$adb" shell cat /sdcard/ui.xml | tr '>' '\n' |
            grep 'class="android.view.View"' |
            sed -nE 's/.*bounds="\[([0-9]+),([0-9]+)\]\[([0-9]+),[0-9]+\]".*/\1 \2 \3/p' |
            awk '$3 - $1 > 1 { print $1, $2; exit }')
          echo "surface at ${left:-?},${top:-?}"
          "$adb" shell input tap $((${left:-0} + 40 * scale / 160)) $((${top:-0} + 16 * scale / 160))
          sleep 2
          "$adb" shell dumpsys input_method | grep -q 'mServedView=com.glim.shell.TextInputView' && break
        done
        "$adb" shell dumpsys input_method | grep -q 'mServedView=com.glim.shell.TextInputView'
        "$adb" shell input text glim
        for i in $(seq 10); do
          sleep 2
          "$adb" logcat -d -s glim | grep -q 'text value glim$' && break
        done
        "$adb" logcat -d -s glim | grep -q 'text value glim$'
        # The system clipboard round-trips through the shell.
        "$adb" logcat -c
        "$adb" shell am start -S -n com.glim.text/com.glim.shell.GlimActivity --es args --clipboard-check
        for i in $(seq 15); do
          sleep 2
          "$adb" logcat -d -s glim | grep -q 'clipboard wrote read=glim clip$' && break
        done
        "$adb" logcat -d -s glim | grep -q 'clipboard wrote read=glim clip$'

  sdk:
    uses: ./.github/workflows/native.yml
    with:
      name: android-sdk
      runs-on: ubuntu-24.04
      packages: ninja-build glslang-tools zip
      ndk: r26d
      nx: |
        pnpm -s aar
        pnpm -s android-sample
